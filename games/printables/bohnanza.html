<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bohnanza - Complete Base Game Printable Deck</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=IM+Fell+English:ital@0;1&family=Montserrat:wght@600;800;900&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: #dfdfdf;
    font-family: 'IM Fell English', Georgia, serif;
    color: #000;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* TOOLBAR FOR BROWSER PREVIEW */
  .toolbar {
    background: #1e293b;
    color: #fff;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .toolbar h1 {
    font-family: 'Cinzel', serif;
    font-size: 16px;
    letter-spacing: 1px;
  }
  .toolbar-actions {
    display: flex;
    gap: 10px;
  }
  .btn {
    background: #f59e0b;
    color: #000;
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 800;
    border: none;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
    text-transform: uppercase;
  }
  .btn-secondary {
    background: #334155;
    color: #fff;
  }
  .btn:hover { opacity: 0.9; }

  /* PAGE & GRID SETUP (3x3 Standard Poker Cards on A4) */
  @page {
    size: A4 portrait;
    margin: 15mm 9.75mm 15mm 9.75mm;
  }

  .sheet {
    width: 190.5mm;
    height: 266.7mm;
    margin: 15mm auto;
    background: #fff;
    display: grid;
    grid-template-columns: repeat(3, 63.5mm);
    grid-template-rows: repeat(3, 88.9mm);
    page-break-after: always;
    box-shadow: 0 5px 20px rgba(0,0,0,0.18);
  }

  @media print {
    body { background: none; }
    .toolbar { display: none !important; }
    .sheet {
      margin: 0;
      box-shadow: none;
      page-break-after: always;
    }
  }

  /* CARD STRUCTURE (63.5mm x 88.9mm) */
  .card {
    width: 63.5mm;
    height: 88.9mm;
    padding: 1.8mm;
    border: 0.2mm dashed #999;
    background: #fff;
    position: relative;
    overflow: hidden;
  }

  .card-inner {
    width: 100%;
    height: 100%;
    border: 1.4pt solid #000;
    border-radius: 2.5mm;
    padding: 1.2mm;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    background: #fff;
  }

  .card-frame-line {
    position: absolute;
    top: 0.8mm; left: 0.8mm; right: 0.8mm; bottom: 0.8mm;
    border: 0.5pt solid #222;
    border-radius: 2mm;
    pointer-events: none;
  }

  /* HEADER */
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 0.9pt solid #000;
    padding-bottom: 0.8mm;
    position: relative;
    z-index: 2;
  }

  .freq-badge {
    width: 6.2mm;
    height: 6.2mm;
    background: #000;
    color: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: 11pt;
    line-height: 1;
  }

  .bean-title {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: 7.2pt;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    text-align: center;
    flex-grow: 1;
    padding: 0 1mm;
  }

  /* ART SECTION */
  .art-box {
    width: 100%;
    height: 40mm;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0.8mm 0;
    border-radius: 1.5mm;
    border: 0.6pt solid #333;
    background: #fafafa;
    overflow: hidden;
  }
  .art-box svg {
    width: 100%;
    height: 100%;
  }

  /* BEANOMETER (HARVEST COIN METER) */
  .beanometer {
    border-top: 1pt solid #000;
    padding-top: 0.8mm;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #fff;
  }

  .beanometer-label {
    font-family: 'Montserrat', sans-serif;
    font-size: 4.8pt;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #555;
    margin-bottom: 0.4mm;
  }

  .meter-slots {
    display: flex;
    justify-content: space-around;
    width: 100%;
    border: 0.7pt solid #000;
    border-radius: 1.2mm;
    background: #fdfdfd;
    padding: 0.6mm 0.2mm;
  }

  .meter-slot {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
    border-right: 0.5pt dashed #aaa;
  }
  .meter-slot:last-child {
    border-right: none;
  }

  .req-beans {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 7pt;
    color: #000;
    line-height: 1.1;
  }

  .arrow-down {
    font-size: 5pt;
    line-height: 0.9;
    color: #444;
  }

  .coin-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 4.2mm;
    height: 4.2mm;
    border-radius: 50%;
    border: 0.8pt solid #000;
    background: #fff;
    font-family: 'Cinzel', serif;
    font-size: 5.5pt;
    font-weight: 900;
    margin-top: 0.3mm;
  }

  /* BOTTOM FANNING BADGE */
  .fanning-badge {
    position: absolute;
    bottom: 0.8mm;
    left: 1.2mm;
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: 8pt;
    color: #666;
  }

  /* SPECIAL CARD: 3RD BEAN FIELD */
  .field-card .card-inner {
    border: 2pt solid #000;
    background: #fafafa;
    text-align: center;
  }
  .field-title {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: 9.5pt;
    letter-spacing: 1px;
    padding: 1.5mm 0;
    border-bottom: 1pt double #000;
  }
  .field-cost-box {
    margin: 2mm auto;
    width: 28mm;
    border: 1pt solid #000;
    border-radius: 1.5mm;
    padding: 1.2mm;
    font-family: 'Montserrat', sans-serif;
    font-size: 7.5pt;
    font-weight: 800;
    background: #fff;
  }
  .field-desc {
    font-size: 6.8pt;
    line-height: 1.35;
    padding: 0 1.5mm;
  }

  /* SPECIAL CARD: RULES & REFERENCE */
  .ref-card .card-inner {
    padding: 1.2mm;
    font-family: 'Montserrat', sans-serif;
  }
  .ref-title {
    font-family: 'Cinzel', serif;
    font-size: 7.5pt;
    font-weight: 900;
    text-align: center;
    border-bottom: 1pt solid #000;
    padding-bottom: 0.6mm;
    margin-bottom: 0.8mm;
  }
  .rule-step {
    margin-bottom: 0.8mm;
    font-size: 5.5pt;
    line-height: 1.2;
  }
  .rule-step strong {
    font-family: 'Cinzel', serif;
    font-size: 6pt;
    color: #000;
  }
  .golden-rule {
    border: 0.8pt dashed #000;
    padding: 0.8mm;
    font-size: 5.2pt;
    text-align: center;
    background: #f7f7f7;
    margin-top: 0.6mm;
  }
</style>
</head>
<body>

// FUNCTION TO BUILD BEAN CARD HTML
function createBeanCard(type) {
  const bean = BEANS[type];
  const slotsHtml = bean.meter.map(m => `
    <div class="meter-slot">
      <div class="req-beans">${m.b}</div>
      <div class="arrow-down">▼</div>
      <div class="coin-badge">${m.c}</div>
    </div>
  `).join('');

  return `
    <div class="card">
      <div class="card-inner">
        <div class="card-frame-line"></div>
        <div class="card-header">
          <div class="freq-badge">${bean.freq}</div>
          <div class="bean-title">${bean.name}</div>
          <div class="freq-badge" style="font-size: 8pt; width: 5mm; height: 5mm;">${bean.freq}</div>
        </div>
        <div class="art-box">${bean.art}</div>
        <div class="beanometer">
          <div class="beanometer-label">Beanometer</div>
          <div class="meter-slots">${slotsHtml}</div>
        </div>
        <div class="fanning-badge">${bean.freq}</div>
      </div>
    </div>
  `;
}

// RULES / PLAYER AID CARD HTML
function createRuleCard() {
  return `
    <div class="card ref-card">
      <div class="card-inner">
        <div class="card-frame-line"></div>
        <div class="ref-title">Bohnanza Turn Order</div>
        <div class="rule-step"><strong>1. Plant Hand Beans:</strong> You MUST plant the 1st card from your hand into a field. You MAY also plant the 2nd card.</div>
        <div class="rule-step"><strong>2. Draw & Trade:</strong> Draw 2 cards face-up. Trade or donate them (and cards from your hand) with anyone. NEVER put traded cards in your hand!</div>
        <div class="rule-step"><strong>3. Plant Traded Beans:</strong> All players must plant beans they received in trades.</div>
        <div class="rule-step"><strong>4. Draw New Cards:</strong> Draw 3 cards, one at a time, to the <em>BACK</em> of your hand.</div>
        <div class="golden-rule">
          <strong>THE GOLDEN RULE:</strong><br>
          NEVER change the order of cards in your hand! Always play from the front, draw to the back.
        </div>
      </div>
    </div>
  `;
}

// RENDER FUNCTION INTO 9-CARD SHEETS
function renderCards(cardsArray) {
  const container = document.getElementById('deck-container');
  container.innerHTML = '';
  
  const totalSheets = Math.ceil(cardsArray.length / 9);
  for (let s = 0; s < totalSheets; s++) {
    const sheetDiv = document.createElement('div');
    sheetDiv.className = 'sheet';
    const pageCards = cardsArray.slice(s * 9, (s + 1) * 9);
    sheetDiv.innerHTML = pageCards.join('');
    container.appendChild(sheetDiv);
  }
}

// BUILD FULL 162-CARD DECK (18 Pages)
function renderFullDeck() {
  const deck = [];
  
  // 150 Standard Bean Cards:
  // Coffee (24), Wax (22), Blue (20), Chili (18), Stink (16), Green (14), Soy (12), Black-eyed (10), Red (8), Garden (6)
  const counts = [
    { type: 'coffee', n: 24 },
    { type: 'wax', n: 22 },
    { type: 'blue', n: 20 },
    { type: 'chili', n: 18 },
    { type: 'stink', n: 16 },
    { type: 'green', n: 14 },
    { type: 'soy', n: 12 },
    { type: 'blackeyed', n: 10 },
    { type: 'red', n: 8 },
    { type: 'garden', n: 6 }
  ];

  counts.forEach(item => {
    for (let i = 0; i < item.n; i++) {
      deck.push(createBeanCard(item.type));
    }
  });

  // 7 3rd Bean Field Cards
  for (let i = 0; i < 7; i++) {
    deck.push(createFieldCard());
  }

  // 5 Player Aid / Rules Reference Cards (completes exactly 162 cards = 18 full pages)
  for (let i = 0; i < 5; i++) {
    deck.push(createRuleCard());
  }

  renderCards(deck);
}

// BUILD MASTER SAMPLER (2 Pages: 1 of each bean, field, and rules)
function renderSampler() {
  const sampler = [
    createBeanCard('coffee'),
    createBeanCard('wax'),
    createBeanCard('blue'),
    createBeanCard('chili'),
    createBeanCard('stink'),
    createBeanCard('green'),
    createBeanCard('soy'),
    createBeanCard('blackeyed'),
    createBeanCard('red'),
    createBeanCard('garden'),
    createFieldCard(),
    createRuleCard()
  ];
  renderCards(sampler);
}

// Default on load: Full 18-Page Deck
window.onload = renderFullDeck;
